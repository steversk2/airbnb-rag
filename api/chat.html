<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabin Concierge</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #f4f1ea; }
  #wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; height: 100dvh; }
  header { background: #2d4a3e; color: #fff; padding: 14px 18px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: .8; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; font-size: 15px; line-height: 1.45; }
  .user { align-self: flex-end; background: #2d4a3e; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #ddd6c7; border-bottom-left-radius: 4px; }
  .src { font-size: 11px; color: #777; margin-top: 6px; border-top: 1px dashed #ddd; padding-top: 4px; }
  .typing { color: #888; font-style: italic; }
  #bar { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #ddd6c7; }
  #q { flex: 1; font-size: 16px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 20px; }
  #send { font-size: 16px; padding: 10px 18px; border: 0; border-radius: 20px; background: #2d4a3e; color: #fff; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>&#127969; Cabin Concierge</h1>
    <p>Ask about the cabin or the local area</p>
  </header>
  <div id="log"></div>
  <div id="bar">
    <input id="q" placeholder="What's the wifi password?" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>
<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
const KEY = new URLSearchParams(location.search).get('key') || '';

function add(text, cls, sources) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'src';
    s.textContent = 'Sources: ' + sources.map(x => (x.source || '?') + (x.section ? ' / ' + x.section : '')).join(' | ');
    d.appendChild(s);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function send() {
  const text = q.value.trim();
  if (!text) return;
  q.value = '';
  add(text, 'user');
  const t = add('Thinking...', 'bot typing');
  try {
    const r = await fetch('/ask?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text })
    });
    const j = await r.json();
    t.remove();
    add(r.ok ? j.answer : ('Error: ' + (j.detail || r.status)), 'bot', j.sources);
  } catch (e) {
    t.remove();
    add('Sorry, something went wrong. Please try again.', 'bot');
  }
}

document.getElementById('send').onclick = send;
q.onkeydown = e => { if (e.key === 'Enter') send(); };
add("Hi! I'm the cabin concierge. Ask me about the house, wifi, checkout, or things to do around Idaho City.", 'bot');
</script>
</body>
</html>
