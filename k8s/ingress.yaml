# Public ingress: TLS + rate limiting. Replace the hostname with your own.
# Requires: Elastic IP on the instance, DNS A record -> Elastic IP,
# security group open for 80/443, cert-manager + ClusterIssuer installed.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: concierge-ratelimit
spec:
  rateLimit:
    average: 20   # requests per minute per IP
    period: 1m
    burst: 40
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concierge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: default-concierge-ratelimit@kubernetescrd
spec:
  tls:
  - hosts:
    - concierge.kaylor.co
    secretName: concierge-tls
  rules:
  - host: concierge.kaylor.co
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: concierge-api
            port:
              number: 8080
