# vLLM serving Qwen2.5-7B-Instruct-AWQ on the T4 GPU.
# NOTE: reconstructed from build notes - verify against the live cluster with:
#   kubectl get deployment vllm-qwen -o yaml
# before treating this as canonical.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.29.0
        args:
        - "--model=Qwen/Qwen2.5-7B-Instruct-AWQ"
        - "--gpu-memory-utilization=0.9"
        - "--max-model-len=4096"
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
spec:
  selector:
    app: vllm-qwen
  ports:
  - port: 8000
    targetPort: 8000
